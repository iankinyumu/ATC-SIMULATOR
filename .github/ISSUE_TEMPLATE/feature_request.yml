name: Feature or improvement
description: Suggest a simulation, communication, accessibility, or community improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Operational sources, examples, or design references
      description: For aviation/data changes, include sources and note any licensing constraints.
    validations:
      required: false
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I can prepare a pull request
        - Maybe, I would like to discuss it
        - No, this is a suggestion
    validations:
      required: true
