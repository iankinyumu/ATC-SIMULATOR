name: Bug report
description: Report a reproducible problem with the simulation or setup.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Do not include API keys, private recordings, or unlicensed airport data.
  - type: input
    id: area
    attributes:
      label: Area
      description: For example simulation, data build, display, speech, or audio.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and commit/branch if known.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before posting.
    validations:
      required: false
